<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Fiume Pre-orders</title>
<link rel="manifest" href="manifest.webmanifest?v=2">
<meta name="theme-color" content="#a4462b">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32-po1.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-po1.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pre-orders">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f2ea; --card: #fffdf9; --ink: #2b2420; --muted: #7a6d63;
    --line: #e6dccf; --accent: #a4462b; --accent-soft: #f3e1d8;
    --alert: #b3261e; --alert-soft: #fbe4e2; --warn: #8a5a00; --warn-soft: #fbf0d9;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: Inter, system-ui, sans-serif; font-size: 15px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px; }

  header { padding: 32px 0 12px; text-align: center; }
  .logo { display: block; width: 100%; max-width: 220px; height: auto; margin: 0 auto 12px; }
  h1 {
    font-family: "Cormorant Garamond", Georgia, serif; font-weight: 600;
    font-size: clamp(34px, 7vw, 48px); line-height: 1.05; margin: 4px 0 4px;
  }
  .sub { color: var(--muted); margin: 0; font-size: 14px; }
  .install {
    margin-top: 12px; background: var(--accent); color: #fff; border: 0; border-radius: 999px;
    padding: 9px 18px; font: inherit; font-weight: 600; font-size: 14px; cursor: pointer;
  }
  .install[hidden], .install-hint[hidden] { display: none; }
  .install-hint { color: var(--muted); font-size: 13px; margin: 10px auto 0; max-width: 320px; }

  .toolbar { display: flex; flex-direction: column; gap: 10px; align-items: center; margin: 18px 0 8px; }
  .search {
    width: 100%; max-width: 420px; padding: 11px 16px;
    border: 1px solid var(--line); border-radius: 999px;
    background: var(--card); font: inherit; color: var(--ink);
  }
  .search:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .chip {
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 999px; padding: 6px 14px; font: inherit; font-size: 13px; font-weight: 500; cursor: pointer;
  }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }

  .day {
    font-size: 11px; letter-spacing: .18em; text-transform: uppercase;
    color: var(--accent); font-weight: 600; margin: 26px 4px 10px;
    display: flex; align-items: center; gap: 8px;
  }
  .day .pill { letter-spacing: .06em; background: var(--accent); color: #fff; border-radius: 999px; padding: 2px 9px; font-size: 10px; }

  .booking {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    margin-bottom: 12px; overflow: hidden;
  }
  .booking.provisional { border-style: dashed; }
  .head {
    width: 100%; display: flex; gap: 14px; align-items: center; text-align: left;
    background: none; border: 0; padding: 14px 16px; font: inherit; color: inherit; cursor: pointer;
  }
  .time {
    flex: 0 0 auto; min-width: 62px; text-align: center; padding: 6px 4px;
    background: var(--accent-soft); border-radius: 10px;
    font-weight: 600; font-size: 17px; color: var(--accent);
  }
  .time small { display: block; font-size: 11px; font-weight: 500; color: var(--muted); }
  .who { flex: 1 1 auto; min-width: 0; }
  .who h2 {
    font-family: "Cormorant Garamond", Georgia, serif; font-weight: 600;
    font-size: 22px; line-height: 1.15; margin: 0;
  }
  .flags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  .flag { font-size: 12px; font-weight: 600; border-radius: 999px; padding: 2px 9px; }
  .flag.alert { background: var(--alert-soft); color: var(--alert); }
  .flag.warn { background: var(--warn-soft); color: var(--warn); }
  .flag.muted { background: #efe8de; color: var(--muted); }
  .chev { flex: 0 0 auto; color: var(--muted); transition: transform .15s ease; font-size: 18px; }
  .booking.open .chev { transform: rotate(90deg); }

  .body { display: none; padding: 0 16px 16px; border-top: 1px solid var(--line); }
  .booking.open .body { display: block; }
  .alerts { margin: 14px 0 0; padding: 10px 12px; border-radius: 10px; background: var(--alert-soft); color: var(--alert); font-weight: 600; font-size: 14px; }
  .alerts div + div { margin-top: 2px; }
  .notes { margin: 10px 0 0; padding: 10px 12px; border-radius: 10px; background: var(--warn-soft); color: #5c3d00; font-size: 14px; }
  .notes div + div { margin-top: 4px; }
  .changes { margin: 10px 0 0; padding: 10px 12px; border-radius: 10px; background: #e8eef6; color: #1f3a5c; font-size: 14px; }
  .changes-label { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; font-weight: 700; margin-bottom: 4px; }
  .changes div + div { margin-top: 4px; }
  .flag.upd { background: #e8eef6; color: #1f3a5c; }
  .send-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
    margin: 14px 0 4px; padding: 14px; border: 0; border-radius: 12px;
    background: #2f6b3a; color: #fff; font: inherit; font-weight: 700; font-size: 16px; cursor: pointer;
  }
  .send-btn small { font-weight: 500; opacity: .85; }
  .flag.sendflag { background: #e3f1e5; color: #2f6b3a; }
  .send { position: fixed; inset: 0; background: var(--bg); z-index: 15; display: flex; flex-direction: column; }
  .send[hidden] { display: none; }
  .send-head { background: #2f6b3a; color: #fff; padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
  .send-head h3 { margin: 0; font-size: 18px; line-height: 1.2; flex: 1; }
  .send-head small { display: block; font-weight: 500; font-size: 13px; opacity: .85; }
  .send-head button { background: none; border: 0; color: #fff; font-size: 30px; line-height: 1; cursor: pointer; padding: 4px 8px; }
  .send-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 12px 14px 40px; max-width: 760px; width: 100%; margin: 0 auto; box-sizing: border-box; }
  .send-hint { color: var(--muted); font-size: 13px; margin: 2px 2px 10px; }
  .send-course { display: flex; justify-content: space-between; align-items: baseline; margin: 22px 2px 8px; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
  .send-course span { letter-spacing: 0; text-transform: none; font-size: 13px; color: var(--muted); font-weight: 600; }
  .send-course.done span { color: #2f6b3a; }
  .send-dish { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; }
  .send-dish.done { opacity: .55; }
  .send-dish-name { font-weight: 700; margin-bottom: 8px; display: flex; justify-content: space-between; gap: 8px; }
  .send-dish-name span { color: var(--muted); font-weight: 600; font-size: 13px; white-space: nowrap; }
  .send-names { display: flex; flex-wrap: wrap; gap: 8px; }
  .gtick {
    min-height: 44px; padding: 8px 14px; border-radius: 999px; border: 2px solid var(--line);
    background: #fff; color: var(--ink); font: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .gtick::before { content: ""; width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--muted); box-sizing: border-box; flex: none; }
  .gtick.sent { background: #e3f1e5; border-color: #2f6b3a; color: #2f6b3a; text-decoration: line-through; }
  .gtick.sent::before { content: "✓"; border: 0; background: #2f6b3a; color: #fff; font-size: 12px; line-height: 18px; text-align: center; text-decoration: none; }
  .gtick .tag { text-decoration: none; }
  .send-reset { display: block; margin: 28px auto 0; background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 999px; padding: 10px 18px; font: inherit; font-size: 14px; cursor: pointer; }
  .send-reset.armed { border-color: #a12d1b; color: #a12d1b; }
  .orig { margin: 14px 0 4px; }
  .orig-label { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); font-weight: 600; margin-bottom: 6px; }
  .orig-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .orig-row button { padding: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #fff; cursor: zoom-in; width: 84px; height: 110px; }
  .orig-row img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .viewer { position: fixed; inset: 0; background: #14100c; z-index: 20; display: flex; flex-direction: column; }
  .viewer[hidden] { display: none; }
  .viewer-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; color: #fff; font-size: 14px; }
  .viewer-bar a { color: #fff; }
  .viewer-bar button { background: none; border: 0; color: #fff; font-size: 30px; line-height: 1; cursor: pointer; padding: 4px 8px; }
  .viewer-img { flex: 1; overflow: auto; -webkit-overflow-scrolling: touch; touch-action: pan-x pan-y pinch-zoom; display: flex; align-items: flex-start; justify-content: center; }
  .viewer-img img { width: 100%; max-width: 1100px; height: auto; display: block; }
  .viewer-img.zoom img { width: 220%; max-width: none; }
  .course {
    font-size: 11px; letter-spacing: .18em; text-transform: uppercase;
    color: var(--accent); font-weight: 600; margin: 18px 0 6px;
    display: flex; justify-content: space-between; gap: 10px;
  }
  .course span { color: var(--muted); letter-spacing: .04em; text-transform: none; font-weight: 500; }
  .course span.short { color: var(--warn); }
  .item { padding: 8px 0; border-bottom: 1px solid var(--line); }
  .item:last-child { border-bottom: 0; }
  .dish { display: flex; gap: 10px; font-weight: 600; }
  .qty { color: var(--accent); min-width: 30px; }
  .guests { margin: 3px 0 0 40px; color: var(--muted); font-size: 13.5px; }
  .guests .tag { color: var(--alert); font-weight: 600; }
  .guests.hl, .dish.hl { background: #fff3b0; }

  .empty-state, .error {
    text-align: center; color: var(--muted); padding: 50px 20px; margin-top: 20px;
    border: 1px dashed var(--line); border-radius: var(--radius);
  }
  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 30px 0; }

  .print-btn {
    display: inline-flex; align-items: center; gap: 6px; margin: 14px 0 0;
    background: var(--card); border: 1px solid var(--line); color: var(--ink);
    border-radius: 999px; padding: 8px 16px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .print-btn:hover { border-color: var(--accent); color: var(--accent); }
  .print-head { display: none; }

  @media print {
    @page { margin: 12mm; }
    body { background: #fff !important; color: #000; font-size: 12.5pt; }
    body.printing header, body.printing .toolbar, body.printing footer, body.printing .day,
    body.printing .send, body.printing .viewer { display: none !important; }
    body.printing .booking { display: none !important; }
    body.printing .booking.print-me { display: block !important; border: 0; border-radius: 0; margin: 0; }
    body.printing .wrap { max-width: none; padding: 0; }
    .print-me .head, .print-me .send-btn, .print-me .print-btn, .print-me .orig { display: none !important; }
    .print-me .body { display: block !important; border: 0; padding: 0; }
    .print-me .print-head { display: block; border-bottom: 2px solid #000; padding-bottom: 6px; margin-bottom: 6px; }
    .print-head h2 { font-family: "Cormorant Garamond", Georgia, serif; font-size: 24pt; margin: 0; line-height: 1.1; }
    .print-head div { font-size: 13pt; font-weight: 600; }
    .print-me .alerts { background: #fff; color: #000; border: 2px solid #000; }
    .print-me .notes, .print-me .changes { background: #fff; color: #000; border: 1px solid #888; }
    .print-me .course { color: #000; font-size: 11pt; border-bottom: 1.5px solid #000; padding-bottom: 2px; margin-top: 14px; break-after: avoid; }
    .print-me .course span, .print-me .course span.short { color: #000; }
    .print-me .item { break-inside: avoid; border-color: #ccc; padding: 5px 0; }
    .print-me .qty { color: #000; }
    .print-me .guests { color: #000; }
    .print-me .guests .tag { color: #000; font-weight: 700; }
    .print-me .guests .tag::before { content: "["; }
    .print-me .guests .tag::after { content: "]"; }
    .print-me .hl { background: none !important; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <img class="logo" src="icons/logo-wordmark.png" alt="Fiume Italian Restaurant" width="1000" height="418">
      <h1>Pre-orders</h1>
      <p class="sub">Upcoming group bookings and what everyone has ordered.</p>
      <button class="install" id="installBtn" type="button" hidden>⬇ Install app</button>
      <p class="install-hint" id="iosHint" hidden>To install on iPhone: tap the Share button, then <b>Add to Home Screen</b>.</p>
    </header>

    <div class="toolbar">
      <input class="search" id="search" type="search" placeholder="Search name or dish" aria-label="Search pre-orders">
      <div class="chips" id="chips">
        <button class="chip on" data-f="all" type="button">All upcoming</button>
        <button class="chip" data-f="week" type="button">Next 7 days</button>
        <button class="chip" data-f="diet" type="button">Allergies &amp; dietary</button>
      </div>
    </div>

    <main id="list"><div class="empty-state">Loading pre-orders…</div></main>

    <footer id="foot">Fiume Italian Kitchen · Compton, Wolverhampton</footer>
  </div>

<div class="send" id="sendView" role="dialog" aria-modal="true" aria-labelledby="sendTitle" hidden>
  <div class="send-head"><h3 id="sendTitle"></h3><button type="button" id="sendClose" aria-label="Close sending">×</button></div>
  <div class="send-body" id="sendBody"></div>
</div>

<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Written order" hidden>
  <div class="viewer-bar"><span>Tap photo to zoom · <a id="viewerLink" href="#" target="_blank" rel="noopener">Open full size</a></span><button type="button" id="viewerClose" aria-label="Close">×</button></div>
  <div class="viewer-img" id="viewerBox"><img id="viewerImg" alt="Photo of the written order"></div>
</div>

<script>
(function () {
  var data = { bookings: [] };
  var filter = 'all';
  var open = {};
  var listEl = document.getElementById('list');
  var searchEl = document.getElementById('search');

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function todayStr(offset) {
    var d = new Date(); d.setDate(d.getDate() + (offset || 0));
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function dayLabel(ds) {
    var d = new Date(ds + 'T12:00:00');
    return d.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
  }
  function guestHtml(g) {
    return esc(g).replace(/\[([^\]]+)\]/g, '<span class="tag">$1</span>');
  }
  function hasDiet(b) {
    if (b.alerts && b.alerts.length) return true;
    return JSON.stringify(b.courses).indexOf('[') !== -1 && /\[[A-Z]/.test(JSON.stringify(b.courses));
  }
  function matches(b, q) {
    if (!q) return true;
    var hay = [b.name, (b.alerts || []).join(' '), (b.notes || []).join(' '), (b.changes || []).join(' ')];
    b.courses.forEach(function (c) { c.items.forEach(function (i) { hay.push(i.dish, i.guests.join(' ')); }); });
    return hay.join(' ').toLowerCase().indexOf(q) !== -1;
  }

  // ---------- Sending (today's bookings only, ticks saved on this device) ----------
  var SENT_PREFIX = 'fiume-sent-';
  function loadSent(id) {
    try { return JSON.parse(localStorage.getItem(SENT_PREFIX + id) || '{}') || {}; } catch (e) { return {}; }
  }
  function saveSent(id, s) {
    try { localStorage.setItem(SENT_PREFIX + id, JSON.stringify(s)); } catch (e) {}
  }
  function cleanOldSent() {
    try {
      var today = todayStr(0);
      for (var i = localStorage.length - 1; i >= 0; i--) {
        var k = localStorage.key(i);
        if (k && k.indexOf(SENT_PREFIX) === 0 && k.slice(SENT_PREFIX.length, SENT_PREFIX.length + 10) < today) localStorage.removeItem(k);
      }
    } catch (e) {}
  }
  // One tick per guest per dish. Key survives reordering; n separates repeated names.
  function tickList(b) {
    var out = [];
    b.courses.forEach(function (c) {
      c.items.forEach(function (i) {
        var seen = {};
        var gs = i.guests.length ? i.guests : Array.apply(null, Array(i.qty)).map(function (_, n) { return '#' + (n + 1); });
        gs.forEach(function (g) {
          seen[g] = (seen[g] || 0) + 1;
          out.push({ course: c.course, dish: i.dish, guest: g, key: c.course + '|' + i.dish + '|' + g + '|' + seen[g] });
        });
      });
    });
    return out;
  }
  function courseWord(c) {
    var m = { 'starters': 'Starters', 'mains': 'Mains', 'desserts': 'Desserts', 'sides and extras': 'Sides' };
    return m[String(c).toLowerCase()] || c;
  }
  // Short status for the booking header, e.g. "✓ Starters sent · Mains 3 of 9"
  function sendStatus(b) {
    var s = loadSent(b.id), ticks = tickList(b), parts = [], allDone = true, any = false;
    b.courses.forEach(function (c) {
      var ct = ticks.filter(function (x) { return x.course === c.course; });
      if (!ct.length) return;
      var cd = ct.filter(function (x) { return s[x.key]; }).length;
      if (cd) any = true;
      if (cd < ct.length) allDone = false;
      if (cd === ct.length) parts.push({ done: true, text: courseWord(c.course) + ' sent' });
      else if (cd) parts.push({ done: false, text: courseWord(c.course) + ' ' + cd + ' of ' + ct.length });
    });
    if (!any) return '';
    if (allDone) return '✓ All courses sent';
    var doneParts = parts.filter(function (p) { return p.done; });
    var lastDone = doneParts.length ? '✓ ' + doneParts[doneParts.length - 1].text : '';
    var inProg = parts.filter(function (p) { return !p.done; }).map(function (p) { return p.text; });
    return [lastDone].concat(inProg).filter(Boolean).join(' · ');
  }
  function sentCount(b) {
    var s = loadSent(b.id), t = tickList(b), n = 0;
    t.forEach(function (x) { if (s[x.key]) n++; });
    return { sent: n, total: t.length };
  }

  var sendView = document.getElementById('sendView'), sendBody = document.getElementById('sendBody'), sendTitle = document.getElementById('sendTitle');
  var sendingId = null;
  function renderSending() {
    var b = data.bookings.find(function (x) { return x.id === sendingId; });
    if (!b) { closeSending(); return; }
    var s = loadSent(b.id), ticks = tickList(b);
    var all = ticks.length, done = ticks.filter(function (x) { return s[x.key]; }).length;
    sendTitle.innerHTML = 'Sending: ' + esc(b.name) + '<small>' + esc(b.time) + ' · ' + b.guests + ' ' + esc(b.guestsLabel || 'guests') + ' · ' + (sendStatus(b) || 'Nothing sent yet') + '</small>';
    var html = '<p class="send-hint">Tap a name as their dish leaves the kitchen. Tap again to undo. Ticks are saved on this phone only.</p>';
    if (b.alerts && b.alerts.length) html += '<div class="alerts">' + b.alerts.map(function (a) { return '<div>⚠ ' + esc(a) + '</div>'; }).join('') + '</div>';
    b.courses.forEach(function (c) {
      var ct = ticks.filter(function (x) { return x.course === c.course; });
      var cd = ct.filter(function (x) { return s[x.key]; }).length;
      html += '<div class="send-course' + (cd === ct.length && ct.length ? ' done' : '') + '">' + esc(c.course) + '<span>' + (cd === ct.length && ct.length ? '✓ ' + esc(courseWord(c.course)) + ' sent' : cd + ' of ' + ct.length + ' sent') + '</span></div>';
      c.items.forEach(function (i) {
        var it = ct.filter(function (x) { return x.dish === i.dish; });
        var idone = it.filter(function (x) { return s[x.key]; }).length;
        html += '<div class="send-dish' + (idone === it.length && it.length ? ' done' : '') + '"><div class="send-dish-name">' + i.qty + '× ' + esc(i.dish) + '<span>' + idone + '/' + it.length + '</span></div><div class="send-names">' +
          it.map(function (x) {
            return '<button type="button" class="gtick' + (s[x.key] ? ' sent' : '') + '" data-key="' + esc(x.key) + '" aria-pressed="' + (!!s[x.key]) + '">' + guestHtml(x.guest) + '</button>';
          }).join('') + '</div></div>';
      });
    });
    html += '<button type="button" class="send-reset" id="sendReset">Clear all ticks</button>';
    sendBody.innerHTML = html;
  }
  function openSending(id) {
    sendingId = id; renderSending(); sendView.hidden = false; sendBody.scrollTop = 0;
    document.body.style.overflow = 'hidden';
  }
  function closeSending() {
    sendView.hidden = true; sendingId = null; document.body.style.overflow = ''; render();
  }
  document.getElementById('sendClose').onclick = closeSending;
  sendBody.addEventListener('click', function (e) {
    if (!sendingId) return;
    var t = e.target.closest('.gtick');
    if (t) {
      var s = loadSent(sendingId), k = t.getAttribute('data-key');
      if (s[k]) delete s[k]; else s[k] = true;
      saveSent(sendingId, s);
      var top = sendBody.scrollTop; renderSending(); sendBody.scrollTop = top;
      return;
    }
    var r = e.target.closest('#sendReset');
    if (r) {
      if (!r.classList.contains('armed')) { r.classList.add('armed'); r.textContent = 'Tap again to clear every tick'; return; }
      saveSent(sendingId, {});
      var top2 = sendBody.scrollTop; renderSending(); sendBody.scrollTop = top2;
    }
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !sendView.hidden) closeSending(); });

  function renderBooking(b, q) {
    var isOpen = open[b.id] || !!q;
    var flags = '';
    var isToday = b.date === todayStr(0);
    var sc = isToday ? sentCount(b) : null;
    if (b.provisional) flags += '<span class="flag warn">Provisional</span>';
    var st = isToday ? sendStatus(b) : '';
    if (st) flags += '<span class="flag sendflag">' + esc(st) + '</span>';
    if (b.alerts && b.alerts.length) flags += '<span class="flag alert">⚠ ' + b.alerts.length + ' allerg' + (b.alerts.length > 1 ? 'ies / dietary' : 'y / dietary') + '</span>';
    if (b.changes && b.changes.length) flags += '<span class="flag upd">↻ Updated</span>';
    if (b.photos && b.photos.length) flags += '<span class="flag muted">📄 Written order</span>';
    if (b.notes && b.notes.length) flags += '<span class="flag muted">' + b.notes.length + ' note' + (b.notes.length > 1 ? 's' : '') + '</span>';

    var body = '<div class="print-head"><h2>' + esc(b.name) + '</h2><div>' + esc(dayLabel(b.date)) + ' · ' + esc(b.time) + ' · ' + b.guests + ' ' + esc(b.guestsLabel || 'guests') + (b.provisional ? ' · PROVISIONAL' : '') + '</div></div>';
    if (isToday) body += '<button type="button" class="send-btn" data-send="' + esc(b.id) + '">🍽 Sending' + (st ? ' <small>(' + esc(st) + ')</small>' : '') + '</button>';
    if (b.alerts && b.alerts.length) body += '<div class="alerts">' + b.alerts.map(function (a) { return '<div>⚠ ' + esc(a) + '</div>'; }).join('') + '</div>';
    if (b.notes && b.notes.length) body += '<div class="notes">' + b.notes.map(function (n) { return '<div>' + esc(n) + '</div>'; }).join('') + '</div>';
    if (b.changes && b.changes.length) body += '<div class="changes"><div class="changes-label">Changes</div>' + b.changes.slice().reverse().map(function (c) { return '<div>' + esc(c) + '</div>'; }).join('') + '</div>';
    if (b.photos && b.photos.length) {
      body += '<div class="orig"><div class="orig-label">Original order</div><div class="orig-row">' +
        b.photos.map(function (p, i) { return '<button type="button" class="orig-photo" data-src="' + esc(p) + '" aria-label="Open photo ' + (i + 1) + ' of the written order"><img loading="lazy" src="' + esc(p) + '" alt=""></button>'; }).join('') +
        '</div></div>';
    }
    body += '<button type="button" class="print-btn" data-print="' + esc(b.id) + '">🖨 Print this order</button>';
    b.courses.forEach(function (c) {
      var total = c.items.reduce(function (s, i) { return s + i.qty; }, 0);
      var isFood = /starter|main|dessert/i.test(c.course);
      var short = isFood && total < b.guests && !b.guestsLabel;
      body += '<div class="course">' + esc(c.course) + '<span class="' + (short ? 'short' : '') + '">' + total + ' ordered' + (short ? ' of ' + b.guests : '') + '</span></div>';
      c.items.forEach(function (i) {
        var hl = q && (i.dish.toLowerCase().indexOf(q) !== -1);
        var ghl = q && (i.guests.join(' ').toLowerCase().indexOf(q) !== -1);
        body += '<div class="item"><div class="dish' + (hl ? ' hl' : '') + '"><span class="qty">' + i.qty + '×</span><span>' + esc(i.dish) + '</span></div>' +
          (i.guests.length ? '<div class="guests' + (ghl ? ' hl' : '') + '">' + i.guests.map(guestHtml).join(', ') + '</div>' : '') + '</div>';
      });
    });

    return '<article class="booking' + (isOpen ? ' open' : '') + (b.provisional ? ' provisional' : '') + '" data-id="' + esc(b.id) + '">' +
      '<button class="head" type="button" aria-expanded="' + isOpen + '">' +
        '<div class="time">' + esc(b.time) + '<small>' + b.guests + ' ' + esc(b.guestsLabel || 'guests') + '</small></div>' +
        '<div class="who"><h2>' + esc(b.name) + '</h2>' + (flags ? '<div class="flags">' + flags + '</div>' : '') + '</div>' +
        '<span class="chev">›</span>' +
      '</button><div class="body">' + body + '</div></article>';
  }

  function render() {
    var q = searchEl.value.trim().toLowerCase();
    var today = todayStr(0), tomorrow = todayStr(1), week = todayStr(7);
    var items = data.bookings.filter(function (b) {
      if (b.date < today) return false;
      if (filter === 'week' && b.date > week) return false;
      if (filter === 'diet' && !hasDiet(b)) return false;
      return matches(b, q);
    }).sort(function (a, b) { return (a.date + a.time).localeCompare(b.date + b.time); });

    if (!items.length) {
      listEl.innerHTML = '<div class="empty-state">' + (q ? 'Nothing matches “' + esc(q) + '”.' : 'No upcoming pre-orders.') + '</div>';
      return;
    }
    var html = '', last = '';
    items.forEach(function (b) {
      if (b.date !== last) {
        var pill = b.date === today ? '<span class="pill">Today</span>' : b.date === tomorrow ? '<span class="pill">Tomorrow</span>' : '';
        html += '<div class="day">' + esc(dayLabel(b.date)) + pill + '</div>';
        last = b.date;
      }
      html += renderBooking(b, q);
    });
    listEl.innerHTML = html;
  }

  var viewer = document.getElementById('viewer'), viewerImg = document.getElementById('viewerImg'), viewerBox = document.getElementById('viewerBox'), viewerLink = document.getElementById('viewerLink');
  function openViewer(src) {
    viewerImg.src = src; viewerLink.href = src; viewerBox.classList.remove('zoom'); viewerBox.scrollTop = 0;
    viewer.hidden = false; document.body.style.overflow = 'hidden';
  }
  function closeViewer() { viewer.hidden = true; viewerImg.removeAttribute('src'); document.body.style.overflow = ''; }
  document.getElementById('viewerClose').onclick = closeViewer;
  viewerImg.addEventListener('click', function () { viewerBox.classList.toggle('zoom'); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !viewer.hidden) closeViewer(); });

  function endPrint() {
    document.body.classList.remove('printing');
    document.querySelectorAll('.print-me').forEach(function (x) { x.classList.remove('print-me'); });
  }
  function printBooking(card) {
    if (!card) return;
    endPrint();
    card.classList.add('print-me');
    document.body.classList.add('printing');
    setTimeout(function () { window.print(); }, 50);
  }
  window.addEventListener('afterprint', endPrint);

  listEl.addEventListener('click', function (e) {
    var sb = e.target.closest('.send-btn');
    if (sb) { openSending(sb.getAttribute('data-send')); return; }
    var pb = e.target.closest('.print-btn');
    if (pb) { printBooking(pb.closest('.booking')); return; }
    var ph = e.target.closest('.orig-photo');
    if (ph) { openViewer(ph.getAttribute('data-src')); return; }
    var head = e.target.closest('.head');
    if (!head) return;
    var card = head.parentNode, id = card.getAttribute('data-id');
    open[id] = !card.classList.contains('open');
    card.classList.toggle('open', open[id]);
    head.setAttribute('aria-expanded', open[id]);
  });
  searchEl.addEventListener('input', render);
  document.getElementById('chips').addEventListener('click', function (e) {
    var c = e.target.closest('.chip'); if (!c) return;
    filter = c.getAttribute('data-f');
    document.querySelectorAll('.chip').forEach(function (x) { x.classList.toggle('on', x === c); });
    render();
  });

  fetch('preorders.json', { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (d) {
      data = d && Array.isArray(d.bookings) ? d : { bookings: [] };
      if (d && d.updated) {
        var u = new Date(d.updated + 'T12:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
        document.getElementById('foot').textContent = 'Last updated ' + u + ' · Fiume Italian Kitchen';
      }
      cleanOldSent();
      render();
    })
    .catch(function () {
      listEl.innerHTML = '<div class="error">Couldn’t load the pre-orders right now. Try refreshing.</div>';
    });

  // ---------- Install as an app ----------
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js', { scope: './' }).catch(function () {}); });
  }
  var standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  var deferred = null, installBtn = document.getElementById('installBtn');
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault(); deferred = e;
    if (!standalone) installBtn.hidden = false;
  });
  installBtn.addEventListener('click', function () {
    if (!deferred) return;
    deferred.prompt();
    deferred.userChoice.then(function () { deferred = null; installBtn.hidden = true; });
  });
  window.addEventListener('appinstalled', function () { installBtn.hidden = true; });
  var ua = navigator.userAgent || '';
  var isIOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (isIOS && !standalone) document.getElementById('iosHint').hidden = false;
})();
</script>
</body>
</html>
